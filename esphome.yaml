esphome:
  name: !secret hostname
  comment: ATX Power controller
  project:
    name: valletw.esp-atx-power
    version: 2.0.0

esp32:
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf
    version: recommended

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 17dB
  fast_connect: On
  ap:
    ssid: !secret wifi_fb_ssid
    password: !secret wifi_fb_password

captive_portal:

ota:
  - platform: esphome
    password: !secret ota_password

api:
  encryption:
    key: !secret api_key

logger:
  hardware_uart: UART0

status_led:
  pin:
    number: GPIO8
    ignore_strapping_warning: true

output:
  - platform: gpio
    id: atx_power_button
    pin: GPIO0

  - platform: gpio
    id: atx_reset_button
    pin: GPIO1

sensor:
  - platform: wifi_signal
    name: "WiFi RSSI"
    update_interval: 60s

button:
  - platform: output
    name: Power reset
    icon: mdi:power
    output: atx_power_button
    duration: 300ms

  - platform: output
    name: Power hard-reset
    icon: mdi:power
    output: atx_power_button
    duration: 5500ms

  - platform: output
    name: Reset
    icon: mdi:power-cycle
    output: atx_reset_button
    duration: 300ms

  - platform: restart
    name: Restart controller

binary_sensor:
  - platform: gpio
    name: Power State
    icon: mdi:power
    device_class: power
    pin: GPIO3

  - platform: gpio
    name: HDD Activity
    icon: mdi:harddisk
    device_class: running
    pin: GPIO10
